<title>건축ON 앱 시안 (테스트)</title><meta name="robots" content="noindex,nofollow">

<style>

@font-face{font-family:'SeoulNamsan';src:url('fonts/SeoulNamsanM.woff2') format('woff2');font-weight:400 500;font-display:swap}
@font-face{font-family:'SeoulNamsan';src:url('fonts/SeoulNamsanB.woff2') format('woff2');font-weight:600 700;font-display:swap}
@font-face{font-family:'SeoulNamsan';src:url('fonts/SeoulNamsanEB.woff2') format('woff2');font-weight:800 900;font-display:swap}
/* Layout: 모바일 앱 1열(최대 480px), 상단 고정 헤더 + 3분야 탭, 화면 전환형. 기존 계산기(남색·연파랑 타일·어두운 견적 카드) 계승 */
:root{
  --bg:#ffffff; --band:#f2f4f6; --card:#ffffff; --ink:#1a1a1a; --ink2:#334155; --muted:#5b6678; --line:#e5e5e5; --line2:#ecedef;
  --navy:#001780; --navy-d:#000d4d; --tint:#eff6ff; --tint-b:#dbeafe; --dark:#1a1d24;
  --c-permit:#001780; --c-new:#0b6b63; --c-int:#9a3d0b;
  --t-permit:#eff6ff; --t-new:#e8f6f4; --t-int:#fdf1e7;
  --b-permit:#dbeafe; --b-new:#c5e9e4; --b-int:#f6d9c2;
  --ok:#05603A; --ok-bg:#ecfdf3; --warn:#93370D; --warn-bg:#fff6ed; --bad:#b42318; --bad-bg:#fef3f2; --gold-bg:#fef3c7; --gold:#92400e;
  --f:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  color-scheme:light;
}
html,body{background:var(--bg);margin:0}
body{font-family:var(--f);color:var(--ink);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--card)}
*{box-sizing:border-box}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
:focus-visible{outline:3px solid #7aa2ff;outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100%;background:var(--bg);position:relative}
.band{height:8px;background:var(--band);margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)))}
.sec-t{font-size:17px;font-weight:800;margin:0 0 12px}
.cg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 6px}
.qt{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.qb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:18px 8px 16px;background:var(--acc-t);border:1.5px solid var(--acc-b);border-radius:14px;color:var(--acc);text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.04);transition:transform .15s,box-shadow .15s}
.qb:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,23,128,.12);border-color:var(--acc)}
.qb .e{font-size:34px;line-height:1;margin-bottom:4px}
.qb b{font-size:16px;font-weight:800;letter-spacing:-.4px;word-break:keep-all}
.qb small{font-size:12px;font-weight:500;color:var(--muted)}
.free{display:flex;gap:6px;flex-wrap:wrap}
.free span{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:999px;background:var(--ok-bg);color:var(--ok);font-size:12.5px;font-weight:800}
.ci{display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 0;border:0;background:none;color:var(--ink);font-size:12.5px;font-weight:600;line-height:1.3;text-align:center;word-break:keep-all}
.ci .cc{width:52px;height:52px;border-radius:16px;background:var(--acc-t);color:var(--acc);display:flex;align-items:center;justify-content:center}
.ci:hover .cc{background:var(--acc-b)}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:14px 0;border:0;border-bottom:1px solid var(--line2);background:none;color:var(--ink);text-align:left}
.row:last-child{border-bottom:0}
.row .rc{flex:none;width:40px;height:40px;border-radius:12px;background:var(--band);color:var(--ink2);display:flex;align-items:center;justify-content:center}
.row b{display:block;font-size:15px;font-weight:700}
.row small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.row .ch{margin-left:auto;color:#98a2b3}
.ask{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border-radius:12px;border:0;background:var(--band);color:var(--ink);text-align:left}
.ask b{font-size:15px}.ask small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.kfab{position:fixed;right:max(16px,calc(50% - 224px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:24;display:flex;align-items:center;gap:6px;padding:0 16px;height:48px;border-radius:24px;background:#FEE500;color:#191919;font-size:14px;font-weight:800;text-decoration:none;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:26;background:var(--card);border-top:1px solid var(--line2);padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav .in{max-width:480px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}
.bulk{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;border-radius:10px;background:var(--band);font-size:13px}
.bulk input[type=checkbox],.ck{width:20px;height:20px;accent-color:var(--navy);flex:none}
.bulk .sp{flex:1;min-width:80px;font-weight:700}
.bulk button,.bulk select{min-height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:700;color:var(--ink2)}
.bulk button.del{border-color:#fda29b;color:var(--bad)}.bulk button.del.cf{background:var(--bad);color:#fff}
.dg{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line2)}
.dg .s{flex:none;width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900}
.tg2{position:relative;flex:none;width:48px;height:28px;border-radius:14px;border:0;background:#d0d5dd}
.tg2::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;background:#fff;transition:left .15s}
.tg2[aria-pressed="true"]{background:var(--ok)}.tg2[aria-pressed="true"]::after{left:23px}
.bnav button{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:58px;padding-top:8px;border:0;background:none;color:#8b95a1;font-size:11.5px;font-weight:700}
.bnav button[aria-current="page"]{color:var(--ink)}
.has-nav .kfab{bottom:calc(74px + env(safe-area-inset-bottom,0px))}
.mq{overflow:hidden;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px 0;border-bottom:1px solid var(--line2);background:#fafbfc}
.mq-l{font-size:11px;font-weight:700;color:var(--muted);padding-inline:max(16px,env(safe-area-inset-left,0px));margin-bottom:8px}
.mq-track{display:flex;gap:10px;width:max-content;animation:mq 28s linear infinite;padding-left:16px}
.mq-i{flex:none;display:flex;align-items:center;justify-content:center;gap:6px;height:40px;min-width:108px;padding:0 14px;border:1px solid var(--line2);border-radius:8px;background:#fff;font-size:13px;font-weight:800;color:#4e5968;white-space:nowrap}
.mq-i img{max-height:26px;max-width:110px;object-fit:contain}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.mq-track{animation:none}}
.yn{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}
.qn{padding:14px 0;border-bottom:1px solid var(--line2)}
.qn p{margin:0;font-size:14.5px;font-weight:700;line-height:1.5}
.qn small{display:block;font-size:12px;color:var(--muted);margin-top:3px;font-weight:500}
.news{display:flex;flex-direction:column;gap:6px;padding:16px 0;border-bottom:1px solid var(--line2)}
.news h3{font-size:16px;font-weight:800;line-height:1.45}
.news p{margin:0;font-size:13.5px;line-height:1.65;color:var(--ink2)}
.news .m{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.ig{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line2);border-radius:10px;text-decoration:none;color:var(--ink)}
.ig .ga{flex:none;width:44px;height:44px;border-radius:22px;background:linear-gradient(45deg,#f9a825,#e1306c,#833ab4);display:flex;align-items:center;justify-content:center;color:#fff}
.yh{display:flex;flex-direction:column;gap:8px;width:100%;padding:18px;border:0;border-radius:12px;background:#b91c1c;color:#fff;text-align:left}
.yh .t{display:flex;justify-content:space-between;align-items:center}
.yh .bd{padding:3px 9px;border-radius:999px;background:#fff;color:#b91c1c;font-size:11.5px;font-weight:900}
.yh .dd{font-size:14px;font-weight:900;color:#fde68a}
.yh b{font-size:20px;font-weight:900;letter-spacing:-.5px}
.yh small{font-size:12.5px;color:#fecaca;font-weight:600}
.yh .ls{display:flex;flex-wrap:wrap;gap:6px}.yh .ls span{padding:4px 9px;border-radius:6px;background:rgba(255,255,255,.16);font-size:12px;font-weight:700}
.yh .go{margin-top:2px;padding:12px;border-radius:8px;background:#fff;color:#b91c1c;font-size:14.5px;font-weight:900;text-align:center}
.yh-bar{display:flex;align-items:center;gap:8px;width:100%;margin:0 0 8px;padding:11px 12px;border:0;border-radius:8px;background:#b91c1c;color:#fff;font-size:13.5px;font-weight:800;text-align:left}
.yh-bar .b{flex:none;padding:2px 7px;border-radius:999px;background:#fff;color:#b91c1c;font-size:11px;font-weight:900}
.yh-s{display:flex;align-items:center;gap:8px;width:100%;padding:11px 14px;border:0;border-radius:10px;background:#fef2f2;color:#b91c1c;font-size:13px;font-weight:800;text-align:left}
.phone{background:#f2f4f6;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.phone .hd2{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--muted)}
.sms{align-self:flex-start;max-width:92%;padding:10px 12px;background:#fff;border-radius:12px 12px 12px 4px;font-size:12.5px;line-height:1.6;color:var(--ink);white-space:pre-line}
.atk{background:#fef9c3;border-radius:12px;padding:12px;font-size:12.5px;line-height:1.6;white-space:pre-line}
.atk .h{display:flex;align-items:center;gap:6px;font-weight:800;margin-bottom:6px}
.ft{background:var(--band);margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding:24px max(16px,env(safe-area-inset-right,0px)) 96px max(16px,env(safe-area-inset-left,0px));font-size:12px;line-height:1.8;color:#6b7684}
.ft b{color:#4e5968;font-size:13px}
.ft a{color:#4e5968}
.ft .lk2{display:flex;gap:14px;margin:10px 0;font-weight:700;color:#4e5968}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line2)}
.hd-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:10px}
.logo{display:flex;align-items:baseline;gap:8px;background:none;border:0;padding:0;color:var(--ink)}
.logo b{font-size:20px;font-weight:900;letter-spacing:-.5px}
.logo b span{display:inline-block;margin-left:2px;padding:0 6px;border-radius:6px;background:var(--navy);color:#fff}
.logo small{font-size:11px;color:var(--muted);font-weight:600}
.back{display:flex;align-items:center;justify-content:center;width:44px;height:44px;margin-left:-10px;border:0;background:none;color:var(--ink)}
.hd-title{flex:1;font-size:16px;font-weight:800}
.ghost{min-height:40px;padding:0 12px;border:1.5px solid var(--tint-b);border-radius:8px;background:var(--tint);color:var(--navy);font-size:13px;font-weight:700;white-space:nowrap}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding-block:0 10px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 8px;border-radius:12px;border:1.5px solid var(--line2);background:var(--card);color:var(--muted);font-size:14px;font-weight:800}
.tab small{font-size:10.5px;font-weight:600}
.tab[aria-selected="true"]{color:#fff}
.tab[data-cat="permit"][aria-selected="true"]{background:var(--c-permit);border-color:var(--c-permit)}
.tab[data-cat="new"][aria-selected="true"]{background:var(--c-new);border-color:var(--c-new)}
.tab[data-cat="int"][aria-selected="true"]{background:var(--c-int);border-color:var(--c-int)}

/* common */
main{padding-block:16px 120px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{text-wrap:balance;margin:0}
.hero{text-align:left;padding-block:6px 0}
.hero h1{font-size:24px;line-height:1.38;font-weight:800;letter-spacing:-.6px;color:#191f28}
.hero h1 em{font-style:normal;color:var(--acc)}
.hero p{margin:10px 0 0;font-size:14.5px;line-height:1.7;color:var(--ink2)}
.sec{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.sec>h3{font-size:16px;font-weight:800;padding-bottom:10px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;background:var(--acc-t);border:1.5px solid var(--acc-b);border-radius:14px;text-align:left;color:var(--ink);min-height:128px}
.tile:hover{border-color:var(--acc)}
.tile .ic{width:44px;height:44px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--acc)}
.tile b{font-size:15px;font-weight:800;letter-spacing:-.3px;color:var(--acc)}
.tile span{font-size:12px;line-height:1.45;color:var(--ink2)}
.tile .tag{margin-top:auto;font-size:11px;font-weight:700;color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border:0;border-radius:8px;background:var(--navy);color:#fff;font-size:16px;font-weight:800}
.btn.acc{background:var(--acc)}
.btn.line{background:var(--card);color:var(--ink2);border:1.5px solid #cbd5e1}
.btn.kakao{background:#FEE500;color:#191919}
.btn.sm{min-height:44px;font-size:14px}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;background:var(--tint);border-left:4px solid var(--navy);border-radius:8px;font-size:13px;line-height:1.6;color:var(--ink2)}
.note.warn{background:var(--warn-bg);border-color:#dc6803;color:var(--warn)}
.note.ok{background:var(--ok-bg);border-color:#12b76a;color:var(--ok)}
.note b{color:inherit}
.pill{display:inline-flex;align-items:center;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:800}
.chip-row{display:flex;gap:6px;flex-wrap:wrap}
.steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.steps3 .c{width:52px;height:52px;border-radius:26px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 8px}
.steps3 b{display:block;font-size:13px}
.steps3 span{font-size:11.5px;color:var(--muted);line-height:1.5}

/* form */
.f{display:flex;flex-direction:column;gap:8px}
.f+.f{margin-top:16px}
.lbl{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:800;color:var(--ink)}
.lbl .fi,.hic{flex:none;width:28px;height:28px;border-radius:8px;background:var(--acc-t);color:var(--acc);display:inline-flex;align-items:center;justify-content:center}
.sec>h3{display:flex;align-items:center;gap:8px}
.it .ii{flex:none;width:34px;height:34px;border-radius:9px;background:var(--acc-t);color:var(--acc);display:flex;align-items:center;justify-content:center;margin-top:1px}
.tile.wide{grid-column:1/-1;flex-direction:row;align-items:center;min-height:0;background:var(--dark);border-color:var(--dark);gap:14px}
.tile.wide b{color:#fff}.tile.wide span{color:rgba(255,255,255,.75)}.tile.wide .ic{background:rgba(255,255,255,.12);color:#fff}
.tile.wide .tag{margin:0;color:#fcd34d}
.hchips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.hchips span{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:999px;background:#fff;border:1px solid var(--line2);font-size:12px;font-weight:700;color:var(--ink2)}
.hchips svg{color:var(--acc)}
.lbl small{font-weight:500;color:var(--muted);margin-left:4px}
.help{font-size:12px;color:var(--muted);line-height:1.5;margin:0}
.seg{display:grid;gap:6px}
.opt{min-height:44px;padding:8px 6px;border-radius:8px;border:1.5px solid var(--acc-b);background:var(--acc-t);color:var(--acc);font-size:13px;font-weight:700;line-height:1.3;text-align:center;word-break:keep-all}
.opt small{display:block;font-size:10.5px;font-weight:600;opacity:.85;margin-top:2px}
.opt[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.inp{width:100%;min-height:48px;padding:10px 14px;border:1.5px solid #cfd4dc;border-radius:8px;font-size:15px;background:#fff;color:var(--ink)}
.numw{display:flex;align-items:center;gap:8px}
.numw .inp{text-align:right;font-weight:800;font-size:17px}
.numw .u{font-size:14px;font-weight:700;color:var(--ink2);white-space:nowrap}
.py{font-size:12px;color:var(--muted)}
textarea.inp{min-height:92px;resize:vertical;line-height:1.6;font-size:14px}
.addr{display:flex;gap:8px}
.addr .inp{flex:1;min-width:0;font-size:14px}
.addr button{flex:none;min-height:48px;padding:0 14px;border:0;border-radius:8px;background:var(--acc);color:#fff;font-size:14px;font-weight:800}
.lk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}
.lk div{padding:9px 4px;background:#f7f9fc;border-radius:8px;text-align:center}
.lk small{display:block;font-size:11px;color:var(--muted)}
.lk b{font-size:13px}

/* sticky estimate bar */
.sbar{position:fixed;left:0;right:0;bottom:0;z-index:25;padding-bottom:env(safe-area-inset-bottom,0px);background:var(--card);border-top:1px solid var(--line2);box-shadow:0 -6px 18px rgba(16,24,40,.08)}
.sbar .in{max-width:480px;margin:0 auto;display:flex;align-items:center;gap:10px;padding-block:10px}
.sbar .est{flex:1;min-width:0}
.sbar .est small{display:block;font-size:11.5px;color:var(--muted)}
.sbar .est b{font-size:17px;font-weight:900;color:var(--acc);font-variant-numeric:tabular-nums}
.sbar .btn{width:auto;flex:none;padding:0 18px;min-height:50px}

/* result */
.dark{background:var(--dark);color:#fff;border-radius:12px;padding:22px 18px;text-align:center}
.dark .k{font-size:11.5px;letter-spacing:3px;color:rgba(255,255,255,.62);font-weight:600}
.dark .amt{font-size:28px;font-weight:800;letter-spacing:-1px;margin-top:8px;font-variant-numeric:tabular-nums;word-break:keep-all}
.dark .amt span{font-size:15px;color:rgba(255,255,255,.68);font-weight:600}
.dark .meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.15)}
.dark .meta small{display:block;font-size:11px;color:rgba(255,255,255,.62)}
.dark .meta b{font-size:15px}
.items{border-top:2px solid var(--ink)}
.it{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding:13px 0;border-bottom:1px solid #f1f3f5}
.it .n{flex:1;min-width:0;font-size:14px;font-weight:700;line-height:1.45}
.it .n small{display:block;font-size:11.5px;font-weight:500;color:var(--muted);margin-top:3px}
.it .a{flex:none;font-size:14.5px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.total{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;padding:16px;background:#f7f9fc;border:1.5px solid #e2e8f0;border-radius:12px}
.total span{font-size:14px;font-weight:800;color:#475569}
.total b{font-size:23px;font-weight:900;color:var(--acc);font-variant-numeric:tabular-nums}
.chk{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.chk li{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.55;color:var(--ink2)}
.chk li svg{flex:none;margin-top:2px;color:var(--acc)}
.chk li.w svg{color:#dc6803}
.links{display:flex;flex-direction:column;gap:8px}
.rel{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:1.5px solid var(--tint-b);border-radius:12px;background:var(--tint);color:var(--navy);font-size:14px;font-weight:800;text-align:left}
.rel span{flex:1}
.bars{display:flex;flex-direction:column;gap:10px}
.barrow{display:grid;grid-template-columns:72px minmax(0,1fr) 70px;gap:10px;align-items:center;font-size:12.5px}
.barrow .tr{height:20px;border-radius:6px;background:#f1f5f9;overflow:hidden}
.barrow .fl{height:100%;border-radius:6px;background:var(--acc)}
.barrow b{text-align:right;font-variant-numeric:tabular-nums}
.site{position:relative;aspect-ratio:1/1;max-width:100%;width:180px;margin:0 auto;border:2px dashed #94a3b8;border-radius:6px;background:#f8fafc}
.site .bld{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--acc);opacity:.85;border-radius:3px}
.site span{position:absolute;left:6px;top:4px;font-size:10.5px;color:var(--muted);font-weight:700}

/* pitches & chat */
.pc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.av{flex:none;width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:900}
.rt{position:relative;height:10px;border-radius:5px;background:#f1f5f9}
.rt .s{position:absolute;top:0;bottom:0;background:var(--acc-b);border-radius:5px}
.rt .m{position:absolute;top:-3px;height:16px;border-radius:8px;background:var(--acc)}
.tg{display:inline-flex;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700}
.msgs{display:flex;flex-direction:column;gap:10px}
.me{align-self:flex-end;max-width:78%;padding:11px 14px;background:var(--navy);color:#fff;border-radius:16px 16px 4px 16px;font-size:14px;line-height:1.55}
.them{align-self:flex-start;max-width:78%;padding:11px 14px;background:#fff;border:1px solid var(--line2);border-radius:16px 16px 16px 4px;font-size:14px;line-height:1.55}
.sys{align-self:center;padding:6px 12px;background:#eef1f5;border-radius:12px;font-size:12px;color:#475569}
.req{display:flex;gap:12px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.dots{display:flex;gap:3px}.dots i{width:14px;height:6px;border-radius:3px;background:#e2e8f0}.dots i.f{background:var(--navy)}
.stat{padding:12px 6px;background:var(--tint);border:1.5px solid var(--tint-b);border-radius:12px;text-align:center}
.stat small{display:block;font-size:11px;color:var(--ink2)}
.stat b{display:block;font-size:20px;font-weight:900;color:var(--navy);margin-top:2px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;padding:10px 16px;border-radius:999px;background:var(--dark);color:#fff;font-size:13px;font-weight:700;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.sample{font-size:11px;color:var(--muted);text-align:center}

/* ===== PC 반응형 (태블릿 720px~, 데스크톱 1024px~) ===== */
@media (min-width:720px){
  .app{max-width:960px}
  .hd .wrap,.sbar .in,.bnav .in{padding-left:24px;padding-right:24px}
  main.view:not(.home){max-width:760px;margin-inline:auto;width:100%}
  .sbar .in{max-width:760px}
  .qt{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  .grid2{grid-template-columns:repeat(3,minmax(0,1fr))}
  .hero h1{font-size:30px}
  .hero p{font-size:15.5px;max-width:640px}
  .tabs{max-width:620px}
  .kfab{right:max(24px,calc(50% - 456px))}
  .bnav{left:50%;right:auto;bottom:16px;transform:translateX(-50%);width:420px;border:1px solid var(--line2);border-radius:18px;box-shadow:0 10px 30px rgba(16,24,40,.14);padding-bottom:0}
  .bnav button{min-height:54px}
  .has-nav .kfab{bottom:calc(16px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:96px}
}
@media (min-width:1024px){
  html,body{background:#f6f7f9}
  .app{max-width:1120px;box-shadow:0 0 0 1px var(--line2)}
  main.home{padding-left:40px;padding-right:40px}
  .hd .wrap{padding-left:40px;padding-right:40px}
  .band{margin-left:-40px;margin-right:-40px}
  .ft,.mq{margin-left:-40px;margin-right:-40px;padding-left:40px;padding-right:40px}
  .mq-l{padding-inline:0}
  .hd-row{padding-block:14px}
  .logo b{font-size:24px}
  .qt{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
  .qb{padding:26px 12px 22px}
  .qb .e{font-size:40px}
  .hero{padding-top:20px !important}
  .hero h1{font-size:36px}
  .yh{padding:24px 28px}
  .yh b{font-size:24px}
  .kfab{right:max(24px,calc(50% - 536px))}
  main.view:not(.home){max-width:820px}
  .sbar .in{max-width:820px}
  .dark{padding:30px 28px}
  .dark .amt{font-size:36px}
}
@media (prefers-reduced-motion:no-preference){.view{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}

/* ===================== 리디자인 v2 : 절제된 건축 톤 ===================== */
:root{
  --bg:#fafaf8; --card:#ffffff; --band:#f3f3f0; --ink:#111318; --ink2:#3a3f4b; --muted:#5d6273; --line:#e7e6e1; --line2:#eeede8;
  --navy:#0f1d3d; --navy-d:#08122a; --dark:#0d1220; --tint:#f1f4fa; --tint-b:#dde4f1;
  --f:'Inter','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --r:14px; --sh:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06); --sh2:0 12px 32px -12px rgba(16,24,40,.18);
}
body{letter-spacing:-.01em}
.app{background:var(--bg)}
/* 헤더: 반투명 + 블러 */
.hd{background:rgba(255,255,255,.86);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--line2)}
.logo b{font-weight:800;letter-spacing:-.04em;font-size:21px}
.logo b span{background:none;color:var(--ink);padding:0;margin-left:1px;position:relative}
.logo b span::after{content:"";position:absolute;right:-7px;top:3px;width:6px;height:6px;border-radius:50%;background:#e5484d}
.ghost{background:var(--ink);color:#fff;border:0;border-radius:999px;padding:0 16px;font-weight:700}
/* 분야 탭: 세그먼트 컨트롤 */
.tabs{background:#efefeb;padding:4px;border-radius:14px;gap:4px;margin-bottom:12px}
.tab{border:0;background:transparent;border-radius:10px;padding:8px 4px 7px;color:var(--muted);font-size:14px;font-weight:700;transition:background .15s,color .15s}
.tab small{font-weight:500;opacity:.8}
.tab[aria-selected="true"],.tab[data-cat][aria-selected="true"]{background:#fff;border:0;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.06)}
.tab[aria-selected="true"]::before{content:"";display:block;width:16px;height:3px;border-radius:2px;background:var(--acc);margin:0 auto 4px}
/* 양성화 띠 배너 */
.yh-bar{background:linear-gradient(90deg,#7f1d1d,#b42318);border-radius:12px;padding:10px 14px;font-weight:700;letter-spacing:-.02em;box-shadow:0 6px 16px -8px rgba(180,35,24,.5)}
.yh-bar .b{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.35)}
.yh-bar>span:nth-child(2){white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 파트너 로고 띠 */
.mq{background:transparent;border-bottom:0;border-top:1px solid var(--line2);padding:14px 0 6px}
.mq-l{font-size:11px;letter-spacing:.08em;color:#9a9fab;font-weight:600}
.mq-i{border:0;background:transparent;color:#a3a7b1;font-weight:700;min-width:auto;height:30px;padding:0 10px;filter:grayscale(1)}
.mq-i img{opacity:.6}
/* 히어로 */
.hero{position:relative;padding:22px 0 4px !important}
.eyebrow{display:inline-flex;align-items:center;gap:8px;margin-bottom:12px;padding:5px 11px 5px 9px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:12px;font-weight:700;color:var(--ink2)}
.eyebrow i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 3px var(--acc-t)}
.hero h1{font-size:28px;line-height:1.28;font-weight:800;letter-spacing:-.045em;color:var(--ink)}
.hero h1 em{color:var(--acc);background:linear-gradient(transparent 68%,var(--acc-t) 68%)}
.hero p{color:var(--muted);font-size:15px}
/* 견적 타일: 흰 카드 + 원형 아이콘 */
.qt{gap:10px}
.qb{align-items:flex-start;text-align:left;justify-content:flex-start;padding:16px;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);color:var(--ink);gap:2px;position:relative;min-height:128px}
.qb .e{display:flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:14px;background:var(--acc-t);font-size:26px;margin-bottom:12px}
.qb b{font-size:15.5px;color:var(--ink);font-weight:700;letter-spacing:-.03em}
.qb small{font-size:12.5px;color:var(--muted)}
.qb::after{content:"→";position:absolute;right:14px;top:14px;color:#c4c6cc;font-size:15px;transition:transform .15s,color .15s}
.qb:hover{transform:translateY(-2px);border-color:var(--ink);box-shadow:var(--sh2)}
.qb:hover::after{color:var(--ink);transform:translateX(2px)}
.ask{background:#fff;border:1px dashed #cfd0d4;border-radius:var(--r)}
.ask:hover{border-color:var(--ink)}
/* 회색 띠 대신 여백 + 얇은 선 */
.band{height:1px;background:var(--line2);margin-top:8px;margin-bottom:8px}
.sec-t{font-size:18px;font-weight:800;letter-spacing:-.035em}
.row .rc{background:#fff;border:1px solid var(--line);color:var(--ink)}
/* 양성화 큰 배너 */
.yh{background:radial-gradient(120% 140% at 100% 0%,#c2410c00 0%,#00000000 40%),linear-gradient(135deg,#1a0b0b 0%,#7f1d1d 55%,#b42318 100%);border-radius:18px;padding:20px;position:relative;overflow:hidden;box-shadow:0 18px 40px -20px rgba(127,29,29,.7)}
.yh::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:22px 22px;mask-image:linear-gradient(120deg,transparent 30%,#000);-webkit-mask-image:linear-gradient(120deg,transparent 30%,#000);pointer-events:none}
.yh>*{position:relative}
.yh .bd{background:#fff;color:#7f1d1d}
.yh b{letter-spacing:-.04em}
.yh .ls span{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18)}
.yh .go{border-radius:10px;color:#7f1d1d}
/* 공통 카드 · 버튼 · 입력 */
.sec{border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:18px}
.sec>h3{border-bottom:0;padding-bottom:0;margin-bottom:14px;letter-spacing:-.03em}
.hic,.lbl .fi{background:var(--band);color:var(--ink)}
.btn{border-radius:12px;background:var(--ink);font-weight:700;letter-spacing:-.02em;transition:transform .1s,filter .15s}
.btn:active{transform:scale(.99)}
.btn:hover{filter:brightness(1.12)}
.btn.acc{background:var(--ink)}
.btn.line{border:1px solid var(--line);color:var(--ink)}
.btn.kakao{background:#FEE500}
.opt{background:#fff;border:1px solid var(--line);color:var(--ink2);border-radius:10px;font-weight:600}
.opt:hover{border-color:#9a9fab}
.opt[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.inp{border:1px solid var(--line);border-radius:10px;background:#fff}
.inp:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 4px rgba(17,19,24,.08)}
.addr button{background:var(--ink);border-radius:10px}
.note{border-left:0;border:1px solid var(--tint-b);border-radius:12px}
.note.warn{border:1px solid #f5d0a9}
.tile{background:#fff;border:1px solid var(--line);border-radius:var(--r)}
.tile b{color:var(--ink)}
.rel{background:#fff;border:1px solid var(--line);color:var(--ink)}
.rel:hover{border-color:var(--ink)}
/* 하단 고정 바 */
.sbar{background:rgba(255,255,255,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 -1px 0 var(--line2)}
.sbar .est b{color:var(--ink)}
/* 견적 결과 카드: 블루프린트 */
.dark{position:relative;overflow:hidden;background:linear-gradient(160deg,#0d1220 0%,#141c33 100%);border-radius:20px;padding:26px 20px;box-shadow:0 24px 48px -24px rgba(13,18,32,.6)}
.dark::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:24px 24px;mask-image:radial-gradient(80% 90% at 50% 0%,#000 30%,transparent 100%);-webkit-mask-image:radial-gradient(80% 90% at 50% 0%,#000 30%,transparent 100%);pointer-events:none}
.dark>*{position:relative}
.dark .amt{font-family:'Inter','Noto Sans KR',sans-serif;font-size:34px;font-weight:800;letter-spacing:-.04em}
.dark .k{letter-spacing:.18em}
.items{border-top:1px solid var(--ink)}
.it .ii{background:var(--band);color:var(--ink)}
.total{background:var(--band);border:0;border-radius:12px}
.total b{color:var(--ink);font-family:'Inter','Noto Sans KR',sans-serif;letter-spacing:-.03em}
.barrow .fl{background:var(--ink)}
/* 하단 메뉴 · 카톡 버튼 */
.bnav{background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.bnav button[aria-current="page"]{color:var(--ink)}
.kfab{box-shadow:0 10px 24px -8px rgba(0,0,0,.3)}
/* 푸터 */
.ft{background:#0d1220;color:#8b90a0;border-top:0}
.ft b{color:#fff;font-size:16px;letter-spacing:-.03em}
.ft a,.ft .lk2{color:#c7cad3}
@media (min-width:720px){
  .hero h1{font-size:38px}
  .qb{min-height:150px;padding:20px}
  .yh{padding:28px}
}
@media (min-width:1024px){
  html,body{background:#f1f1ee}
  .app{box-shadow:none}
  .hero{padding-top:44px !important}
  .hero h1{font-size:46px;line-height:1.18}
  .hero p{font-size:16.5px}
  .qb{min-height:168px}
  .qb .e{width:56px;height:56px;font-size:30px;border-radius:16px}
  .mq{padding:16px 40px 6px}
  .qb b{font-size:17px}
  .dark .amt{font-size:42px}
}

/* ===================== 다크 모드 (인스타그램 스타일) ===================== */
.thm{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink)}
html[data-theme=dark]{
  color-scheme:dark;
  --bg:var(--dk0); --card:var(--dk1); --band:var(--dk2); --ink:#f5f5f5; --ink2:#d4d4d4; --muted:#a8a8a8; --line:var(--dk3); --line2:var(--dk2);
  --navy:#f5f5f5; --navy-d:#ffffff; --dark:var(--dk1); --tint:color-mix(in srgb,var(--p-hi) 10%,transparent); --tint-b:color-mix(in srgb,var(--p-hi) 26%,transparent);
  --ok:#4ade80; --ok-bg:rgba(74,222,128,.1); --warn:#fbbf24; --warn-bg:rgba(251,191,36,.08); --bad:#f87171; --bad-bg:rgba(248,113,113,.1);
  --sh:none; --sh2:0 0 0 1px var(--dk4);
  --t-new:var(--dk2); --t-permit:var(--dk2); --t-int:var(--dk2); --b-new:var(--dk3); --b-permit:var(--dk3); --b-int:var(--dk3); --c-new:var(--p-hi); --c-permit:var(--p-hi); --c-int:var(--p-hi); --dl:#fbbf24;
}
html[data-theme=dark],html[data-theme=dark] body,html[data-theme=dark] .app{background:var(--dk0)}
html[data-theme=dark] .app{box-shadow:none}
html[data-theme=dark] .hd{background:rgba(17,21,14,.82);border-bottom:1px solid var(--dk2)}
html[data-theme=dark] body::before{background:var(--dk0)}
html[data-theme=dark] .logo b span::after{background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5)}
html[data-theme=dark] .ghost{background:var(--brand);color:#fff}
html[data-theme=dark] .tabs{background:var(--dk1);border:1px solid var(--dk3)}
html[data-theme=dark] .tab[aria-selected="true"]{background:var(--dk3);color:#fff;box-shadow:none}
html[data-theme=dark] .eyebrow{background:var(--dk1);border-color:var(--dk3);color:#d4d4d4}
/* 스토리 링 느낌의 그라데이션 테두리 타일 */
html[data-theme=dark] .qb{background:var(--dk1);border:1px solid var(--dk3);color:#f5f5f5}
html[data-theme=dark] .qb .e{background:var(--dk0);position:relative;border-radius:50%}
html[data-theme=dark] .qb .e::before{content:"";position:absolute;inset:-3px;border-radius:50%;padding:2px;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
html[data-theme=dark] .qb:hover{border-color:var(--dk4);background:var(--dk2);box-shadow:none}
html[data-theme=dark] .qb::after{color:#555}
html[data-theme=dark] .qb:hover::after{color:#fff}
html[data-theme=dark] .ask{background:var(--dk1);border:1px dashed var(--dk4)}
html[data-theme=dark] .row .rc{background:var(--dk1) !important;border-color:var(--dk3);color:#f5f5f5}
html[data-theme=dark] .mq-i{color:#737373}
html[data-theme=dark] .sec,html[data-theme=dark] .pc,html[data-theme=dark] .req,html[data-theme=dark] .tile,html[data-theme=dark] .rel{background:var(--dk1);border-color:var(--dk3);color:#f5f5f5}
html[data-theme=dark] .rel{color:#f5f5f5}
html[data-theme=dark] .hic,html[data-theme=dark] .lbl .fi,html[data-theme=dark] .it .ii{background:var(--dk2);color:#f5f5f5}
html[data-theme=dark] .btn{background:var(--brand);color:#fff}
html[data-theme=dark] .btn.acc{background:var(--brand)}
html[data-theme=dark] .btn.line{background:transparent;border:1px solid var(--dk4);color:#f5f5f5}
html[data-theme=dark] .btn.kakao{background:#FEE500;color:#191919}
html[data-theme=dark] .opt{background:var(--dk1);border-color:var(--dk3);color:#d4d4d4}

function selfSummary(k, A){
  const x=SELF[k], ok=[], rev=[], unk=[], none=[], docs=[];
  x.qs.forEach((q,i)=>{ const a=A[i];
    if(!a){ none.push(q.q); return; }
    if(a==='모름'){ unk.push(q.q); docs.push(q.d); return; }
    const line = a==='예'?q.y:q.n;
    if(q.c && a===q.c) rev.push({t:line, w:q.w}); else ok.push(line);
  });
  const answered=x.qs.length-none.length, allUnk=answered>0 && unk.length===answered;
  const title = !answered ? '아직 답변이 없어요' : allUnk ? '확인할 정보가 필요해요' : rev.length ? '추가 검토가 필요한 사항이 있어요' : '입력한 답변을 정리했어요';
  const text=[`[건축ON 사전 점검 · ${x.name}]`, `질문 응답 ${answered}/${x.qs.length}`]
    .concat(x.qs.map((q,i)=>`- ${q.q} → ${A[i]||'미응답'}`))
    .concat(rev.length?['추가 검토 필요: '+rev.map(r=>r.w).join(' / ')]:[])
    .concat(unk.length?['아직 모르는 사항 '+unk.length+'개']:[]).join('\n');
  return {k, name:x.name, ok, rev, unk, none, docs:[...new Set(docs)], answered, total:x.qs.length, allUnk, title, text, answers:x.qs.map((q,i)=>[q.q, A[i]||'미응답'])};
}

function addrRegion(t){ const x=String(t||'').replace(/\s+/g,' ').trim(); const m=x.match(/(서울|부산|대구|인천|광주|대전|울산|세종|경기|강원|충북|충남|전북|전남|경북|경남|제주)[^ ]*\s+([^ ]+(시|군|구))(\s+[^ ]+구)?\s+([^ ]+(동|읍|면|가|로|길))/); if(m) return (m[1]+' '+m[2]+(m[4]||'')+' '+m[5].replace(/\d.*$/,'')).replace(/\s+/g,' '); const g=x.match(/([^ ]+(구|군|시))\s+([^ ]+(동|읍|면|로|길))/); if(g){ const gu=g[1].replace(/구$/,''); return ((g[2]==='구'&&SEOUL_GU.includes(gu))?'서울 ':'')+g[1]+' '+g[3].replace(/\d.*$/,''); }
  const rd=x.match(/([가-힣]{2,})(대로|로|길)/); if(rd){ const gu=SEOUL_GU.find(n=>n.length>=2&&rd[1].startsWith(n)); if(gu) return '서울 '+gu+'구 '+rd[0]; }
  const dn=x.match(/([가-힣]{1,4})(\d*)동/); if(dn){ const gu=DONG_GU[dn[1]]; if(gu) return '서울 '+gu+'구 '+dn[1]+(dn[2]||'')+'동'; }
  return '지역 확인 필요'; }

async function runSrvDiag(){
  const R=[], K='kon_diag_test';
  const st=(n,f)=>{ try{ f(); R.push([n,'ok','저장소 OK']); }catch(e){ R.push([n,'err','실패 · '+(e.name||'오류')]); } };
  st('설정 읽기',()=>{ localStorage.getItem('kon_cfg'); });
  st('설정 추가',()=>{ localStorage.setItem(K,'1'); if(localStorage.getItem(K)!=='1') throw new Error('x'); });
  st('설정 수정',()=>{ localStorage.setItem(K,'2'); if(localStorage.getItem(K)!=='2') throw new Error('x'); });
  st('설정 삭제',()=>{ localStorage.removeItem(K); if(localStorage.getItem(K)!==null) throw new Error('x'); });
  st('사진 저장 공간',()=>{ localStorage.setItem(K,'x'.repeat(300000)); localStorage.removeItem(K); });
  const api=async(n,url,opt)=>{ const ctl=new AbortController(), t=setTimeout(()=>ctl.abort(),6000); try{ const r=await fetch(url,Object.assign({signal:ctl.signal},opt||{})); const ok=r.status<400||r.status===405; R.push([n, ok?'ok':(r.status===404?'warn':'err'), 'HTTP '+r.status+(r.status===404?' · 아직 연결 전':'')]); }catch(e){ R.push([n,'warn',e.name==='AbortError'?'응답 없음 · 아직 연결 전':'연결 안 됨 · 아직 연결 전']); } finally{ clearTimeout(t); } };
  await api('건축물대장 조회','/api/lookup?ping=1');
  await api('문자 발송','/api/send-sms',{method:'OPTIONS'});
  await api('신청 저장','/api/submissions?ping=1');
  return R;
}
